services:
  - type: web
    name: portal-gtm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ID
        value: "284"
      - key: ADMIN_NAME
        value: Administrador GTM
      - key: ADMIN_EMAIL
        value: marlomscsrs@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISCORD_WEBHOOK_QRU
        sync: false
